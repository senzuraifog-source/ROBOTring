<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="mobile-web-app-capable" content="yes">
<title>ROBO RING – robotí zápasy</title>
<style>
:root{--g:#3dff7a;--r:#ff3b3b;--b:#33c3ff;--y:#ffd23f;--bg:#070a12;--pn:rgba(8,12,26,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:none;overscroll-behavior:none}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;pointer-events:none}
.screen>*{pointer-events:auto}
/* ---------- výběr robota ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 14px 6px;gap:10px;pointer-events:none}
.logo{font-weight:900;font-size:clamp(22px,6vmin,46px);letter-spacing:.06em;text-shadow:0 0 18px rgba(255,80,40,.7),0 3px 0 #000;font-style:italic}
.logo span{color:var(--y)}
.pill{font-size:12px;padding:6px 10px;border-radius:99px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);max-width:52vw;text-align:right}
.pill.ok{border-color:var(--g);color:#bfffd2}.pill.err{border-color:var(--r);color:#ffc0c0}
.selPanel{margin-top:auto;background:var(--pn);border-top:2px solid rgba(255,255,255,.12);padding:10px 12px max(12px,env(safe-area-inset-bottom));max-height:62vh;overflow-y:auto;touch-action:pan-y;backdrop-filter:blur(6px)}
@media (orientation:landscape){.selPanel{position:absolute;right:0;top:0;bottom:0;width:min(470px,48vw);max-height:none;border-top:0;border-left:2px solid rgba(255,255,255,.12);padding-top:max(10px,env(safe-area-inset-top))}}
.robHead{display:flex;align-items:center;gap:8px}
.arrow{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.08);font-size:20px;flex:none}
.robTitle{flex:1;text-align:center}
#robName{font-size:28px;font-weight:900;letter-spacing:.08em}
#robClass{font-size:13px;opacity:.8}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin:10px 2px 6px;font-size:13px}
.stats .sb{height:9px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.stats .sb i{display:block;height:100%;background:linear-gradient(90deg,#ff8a1f,#ffd23f);border-radius:9px}
.skl{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.06);border-radius:10px;padding:7px 9px;margin-top:6px;font-size:13px;line-height:1.25}
.skl .ic{font-size:24px}.skl b{font-size:14px}.skl small{opacity:.75}
.gest{display:inline-block;margin-top:2px;font-size:11.5px;padding:2px 7px;border-radius:99px;background:rgba(255,210,63,.18);color:#ffe58a}
.passive{font-size:12.5px;opacity:.85;margin:8px 2px}
.roblist{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;touch-action:pan-x}
.chip{flex:none;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.07);font-size:12px;font-weight:800;border:2px solid transparent;display:flex;align-items:center;gap:6px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip.on{border-color:var(--y);background:rgba(255,210,63,.15)}
.settings{display:grid;gap:6px;margin:4px 0 10px}
.set{display:flex;align-items:center;gap:8px;font-size:12px}
.set label{width:96px;opacity:.8;flex:none}
.seg{display:flex;flex:1;background:rgba(255,255,255,.06);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:12px;font-weight:700;opacity:.75}
.seg button.on{background:rgba(255,255,255,.18);opacity:1}
.play{width:100%;padding:16px;border-radius:14px;font-size:22px;font-weight:900;letter-spacing:.1em;background:linear-gradient(180deg,#ff6a2b,#e0261b);box-shadow:0 6px 0 #7a1009,0 0 24px rgba(255,80,30,.45)}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #7a1009}
/* ---------- nastavení kamery ---------- */
#scrSetup{justify-content:flex-end;background:rgba(5,8,16,.55)}
.setupBox{background:var(--pn);margin:0 auto max(10px,env(safe-area-inset-bottom));width:min(560px,96vw);border-radius:16px;padding:12px 14px;border:2px solid rgba(255,255,255,.12)}
.setupBox h2{margin:0 0 4px;font-size:clamp(18px,4.6vmin,30px)}
.setupBox p{margin:0 0 8px;font-size:13.5px;opacity:.85;line-height:1.35}
.checks{display:flex;gap:6px;margin-bottom:8px}
.checks span{flex:1;text-align:center;padding:8px 4px;border-radius:10px;font-weight:900;font-size:clamp(13px,3.6vmin,22px);background:rgba(255,59,59,.25);border:2px solid var(--r)}
.checks span.ok{background:rgba(61,255,122,.2);border-color:var(--g)}
.prog{height:12px;border-radius:12px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3dff7a,#ffd23f)}
.msg{font-size:clamp(14px,3.8vmin,24px);font-weight:800;min-height:1.3em;margin-bottom:8px;text-align:center}
.row{display:flex;gap:8px}
.btn2{flex:1;padding:12px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:800;font-size:14px}
.btn2.hot{background:linear-gradient(180deg,#ff6a2b,#e0261b)}
/* ---------- kamera PiP ---------- */
#pip{position:fixed;z-index:20;overflow:hidden;border-radius:14px;border:3px solid var(--g);background:#000;pointer-events:none}
#pip .mir{position:absolute;inset:0;transform:scaleX(-1)}
#pip video,#pip canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#pip.bad{border-color:var(--r)}
#pip.small{left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));width:22vmin;height:29vmin;min-width:96px;min-height:126px}
#pip.big{left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);width:min(72vw,46vh);height:min(52vh,96vw)}
@media (orientation:landscape){#pip.big{width:min(46vw,80vh);height:min(48vh,60vw)}}
#pipInfo{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:2px 4px;background:rgba(0,0,0,.55);text-align:center}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:15;pointer-events:none}
.bars{position:absolute;top:max(6px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:10px;align-items:flex-start}
.side{flex:1;min-width:0}
.side.rt{text-align:right}
.nm{font-weight:900;font-size:clamp(13px,3.6vmin,28px);letter-spacing:.06em;text-shadow:0 2px 0 #000;white-space:nowrap}
.bar{position:relative;height:clamp(14px,3.8vmin,30px);background:rgba(0,0,0,.65);border:2px solid rgba(255,255,255,.55);border-radius:7px;overflow:hidden;margin-top:3px}
.bar i,.bar b{position:absolute;top:0;bottom:0;left:0;width:100%;transform-origin:left center}
.side.rt .bar i,.side.rt .bar b{transform-origin:right center}
.hpb b{background:#fff;opacity:.65}
.hpb i{background:linear-gradient(#8dffaa,#16c24a)}
.hpb.low i{background:linear-gradient(#ff8d8d,#d41f1f)}
.enb{height:clamp(8px,2vmin,15px);border-width:1px}
.enb i{background:linear-gradient(#8fe6ff,#1a8cff)}
.wins{font-size:clamp(12px,3vmin,22px);margin-top:2px;letter-spacing:.15em}
.mid{min-width:14vmin;text-align:center}
#timer{font-size:clamp(26px,8vmin,64px);font-weight:900;line-height:1;text-shadow:0 3px 0 #000}
#rnd{font-size:clamp(10px,2.4vmin,18px);font-weight:800;opacity:.85}
#skillBar{position:absolute;right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px}
.sk{width:clamp(110px,21vmin,190px);padding:6px 8px;border-radius:12px;background:rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.25);font-size:clamp(10px,2.3vmin,16px);line-height:1.2;position:relative;overflow:hidden}
.sk .ic{font-size:clamp(20px,5.5vmin,40px);line-height:1}
.sk .t{font-weight:900}
.sk .g{opacity:.8}
.sk.ready{border-color:var(--y);box-shadow:0 0 18px rgba(255,210,63,.55)}
.sk:not(.ready){opacity:.72}
.sk .cdv{position:absolute;right:5px;top:5px;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.8);font-size:clamp(11px,2.6vmin,18px);font-weight:900}
#hud.touch #skillBar{bottom:auto;top:calc(max(6px,env(safe-area-inset-top)) + clamp(70px,15vmin,120px))}
#hud.touch #btnPause{left:auto;right:max(8px,env(safe-area-inset-right));top:calc(max(6px,env(safe-area-inset-top)) + clamp(150px,32vmin,240px));transform:none}
#guardInd{position:absolute;left:max(8px,env(safe-area-inset-left));top:19%;font-weight:900;font-size:clamp(14px,4vmin,30px);padding:4px 14px;border-radius:99px;background:rgba(51,195,255,.3);border:2px solid var(--b);opacity:0;transition:opacity .1s}
#guardInd.on{opacity:1}
#combo{position:absolute;left:max(10px,env(safe-area-inset-left));top:27%;font-weight:900;font-size:clamp(18px,6vmin,48px);color:var(--y);text-shadow:0 3px 0 #000;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#btnPause{position:absolute;left:50%;top:calc(max(6px,env(safe-area-inset-top)) + clamp(44px,12vmin,96px));transform:translateX(-50%);pointer-events:auto;width:40px;height:32px;border-radius:9px;background:rgba(0,0,0,.5);font-size:13px}
/* dotykové ovládání */
#touchPad{position:fixed;inset:auto 0 0 0;z-index:16;display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px max(12px,env(safe-area-inset-bottom));pointer-events:none}
#touchPad button{pointer-events:auto;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);font-size:20px;font-weight:900;touch-action:none}
#touchPad button.dn{background:rgba(255,210,63,.4)}
.dpad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:4px}
.dpad [data-k=up]{grid-column:2}.dpad [data-k=left]{grid-column:1;grid-row:2}.dpad [data-k=down]{grid-column:2;grid-row:2}.dpad [data-k=right]{grid-column:3;grid-row:2}
.acts{display:grid;grid-template-columns:repeat(3,58px);gap:6px;margin-bottom:90px}
/* hlášky */
#announce{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:30;pointer-events:none;font-weight:900;font-size:clamp(34px,13vmin,120px);letter-spacing:.04em;text-shadow:0 0 24px rgba(255,90,20,.85),0 6px 0 #000;opacity:0;font-style:italic;line-height:1.05}
#announce small{display:block;font-size:.32em;letter-spacing:.08em;font-style:normal;margin-top:6px}
#announce.go{animation:ann 1.3s ease-out forwards}
#announce.hold{animation:annh .4s ease-out forwards}
#announce.sk{color:var(--y);font-size:clamp(24px,8vmin,70px)}
@keyframes ann{0%{transform:scale(2.2);opacity:0}14%{transform:scale(1);opacity:1}78%{opacity:1}100%{transform:scale(.92);opacity:0}}
@keyframes annh{0%{transform:scale(2);opacity:0}100%{transform:scale(1);opacity:1}}
.fl{position:fixed;z-index:25;font-weight:900;font-size:clamp(16px,5.5vmin,44px);pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 3px 0 #000,0 0 10px rgba(0,0,0,.6);animation:fl .95s ease-out forwards;white-space:nowrap}
.fl.big{font-size:clamp(22px,8vmin,64px)}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
#flash{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 40%,rgba(255,0,0,.55) 100%)}
#warn{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(40,0,0,.55);pointer-events:none}
.warnBox{text-align:center;padding:16px 20px;border-radius:18px;background:rgba(0,0,0,.75);border:3px solid var(--r);max-width:92vw;animation:pulse 1s infinite}
.warnBox .big{font-size:clamp(40px,12vmin,90px)}
#warnTitle{font-weight:900;font-size:clamp(20px,7vmin,56px);color:#ff8080}
#warnText{font-size:clamp(14px,4.2vmin,30px);margin-top:6px;font-weight:700}
@keyframes pulse{50%{transform:scale(1.04)}}
.modal{margin:auto;background:var(--pn);border:2px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;width:min(440px,92vw);text-align:center}
.modal h2{margin:0 0 10px;font-size:clamp(24px,7vmin,48px);font-weight:900;font-style:italic}
.modal .btn2{display:block;width:100%;margin-top:8px;padding:14px;font-size:16px}
.rgrid{display:grid;grid-template-columns:1fr auto;gap:6px 14px;text-align:left;font-size:15px;margin:8px 0 6px;background:rgba(255,255,255,.05);padding:10px 14px;border-radius:12px}
.rgrid b{text-align:right}
#err{position:fixed;left:6px;right:6px;bottom:6px;z-index:99;background:#400;border:1px solid #f55;color:#fdd;font:12px monospace;padding:6px;border-radius:8px;white-space:pre-wrap;max-height:30vh;overflow:auto}
#loading{position:fixed;inset:0;z-index:98;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);font-weight:900;font-size:22px;text-align:center;padding:20px}
#loading small{font-weight:400;font-size:14px;opacity:.75;max-width:420px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>

<body>
<canvas id="c3d"></canvas>

<div id="loading">🤖 ROBO RING<small id="loadTxt">Načítám…</small></div>

<!-- VÝBĚR ROBOTA -->
<section id="scrSelect" class="screen hidden">
  <div class="topbar"><div class="logo">ROBO<span>RING</span></div><div id="aiPill" class="pill">AI detekce: čeká…</div></div>
  <div class="selPanel">
    <div class="robHead">
      <button class="arrow" id="prevBot">◀</button>
      <div class="robTitle"><div id="robName"></div><div id="robClass"></div></div>
      <button class="arrow" id="nextBot">▶</button>
    </div>
    <div id="robStats" class="stats"></div>
    <div id="robSkills"></div>
    <div id="robPassive" class="passive"></div>
    <div id="robList" class="roblist"></div>
    <div class="settings">
      <div class="set"><label>Obtížnost</label><div class="seg" data-key="diff"><button data-v="0">Lehká</button><button data-v="1">Normální</button><button data-v="2">Těžká</button></div></div>
      <div class="set"><label>Detekce těla</label><div class="seg" data-key="model"><button data-v="lite">Rychlá</button><button data-v="full">Přesná</button></div></div>
      <div class="set"><label>Citlivost úderů</label><div class="seg" data-key="sens"><button data-v="0">Nízká</button><button data-v="1">Střední</button><button data-v="2">Vysoká</button></div></div>
      <div class="set"><label>Zvuk</label><div class="seg" data-key="sound"><button data-v="1">Zapnutý</button><button data-v="0">Vypnutý</button></div></div>
    </div>
    <button id="btnPlay" class="play">▶ HRÁT</button>
  </div>
</section>

<!-- NASTAVENÍ KAMERY -->
<section id="scrSetup" class="screen hidden">
  <div class="setupBox">
    <h2 id="setupTitle">Postav se před telefon</h2>
    <p id="setupHint">Opři telefon přední kamerou k sobě a ustup asi 1,5–2,5 m. Musíš být vidět <b>aspoň do pasu</b>, ideálně i s rukama nad hlavou.</p>
    <div class="checks"><span id="ckHead">HLAVA</span><span id="ckSh">RAMENA</span><span id="ckHip">PAS</span></div>
    <div class="prog"><i id="calBar"></i></div>
    <div id="setupMsg" class="msg"></div>
    <div class="row"><button id="btnBack" class="btn2">← Zpět</button><button id="btnRetry" class="btn2 hidden">↻ Zkusit znovu</button><button id="btnNoCam" class="btn2">Hrát bez kamery</button></div>
  </div>
</section>

<div id="pip" class="hidden"><div class="mir"><video id="vid" playsinline muted autoplay></video><canvas id="pipCv"></canvas></div><div id="pipInfo"></div></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="bars">
    <div class="side"><div class="nm" id="p1nm"></div><div class="bar hpb" id="p1bar"><b id="p1lag"></b><i id="p1hp"></i></div><div class="bar enb"><i id="p1en"></i></div><div class="wins" id="p1w"></div></div>
    <div class="mid"><div id="timer">90</div><div id="rnd">KOLO 1</div></div>
    <div class="side rt"><div class="nm" id="p2nm"></div><div class="bar hpb" id="p2bar"><b id="p2lag"></b><i id="p2hp"></i></div><div class="bar enb"><i id="p2en"></i></div><div class="wins" id="p2w"></div></div>
  </div>
  <button id="btnPause">❚❚</button>
  <div id="combo"></div>
  <div id="guardInd">🛡️ BLOK</div>
  <div id="skillBar"><div class="sk" id="sk0"></div><div class="sk" id="sk1"></div></div>
</div>
<div id="touchPad" class="hidden">
  <div class="dpad"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div>
  <div class="acts"><button data-k="s0">1</button><button data-k="s1">2</button><button data-k="guard">🛡️</button><button data-k="pl">👊</button><button data-k="pr">👊</button></div>
</div>
<div id="flash"></div>
<div id="announce"></div>
<div id="warn" class="hidden"><div class="warnBox"><div class="big">⚠️</div><div id="warnTitle">NEJSI VIDĚT DO PASU</div><div id="warnText">Ustup dál od telefonu</div></div></div>

<section id="scrPause" class="screen hidden" style="background:rgba(0,0,0,.6)">
  <div class="modal"><h2>PAUZA</h2>
    <button class="btn2 hot" id="btnResume">▶ Pokračovat</button>
    <button class="btn2" id="btnRecal">🎯 Překalibrovat kameru</button>
    <button class="btn2" id="btnMenu">🏠 Zpět do menu</button>
  </div>
</section>

<section id="scrResult" class="screen hidden" style="background:rgba(0,0,0,.55)">
  <div class="modal"><h2 id="resTitle">VÍTĚZSTVÍ!</h2><div id="resSub"></div>
    <div class="rgrid" id="resGrid"></div>
    <button class="btn2 hot" id="btnAgain">🔁 Odveta</button>
    <button class="btn2" id="btnPick">🤖 Vybrat jiného robota</button>
  </div>
</section>

<script>
// Pojistka: když se hra nenačte (chybí internet / blokované knihovny), ukaž hlášku.
window.__showErr = function(m){var e=document.getElementById('err');if(!e){e=document.createElement('div');e.id='err';document.body.appendChild(e);}e.textContent='⚠ '+m;};
window.addEventListener('error',function(e){if(e&&e.message)window.__showErr(e.message+(e.lineno?' (ř. '+e.lineno+')':''));});
window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;if(r&&!r.__handled)console.warn(r);});
setTimeout(function(){if(!window.__gameStarted){var t=document.getElementById('loadTxt');if(t)t.innerHTML='Nepodařilo se načíst 3D knihovnu.<br>Zkontroluj internet a obnov stránku.';}},20000);
</script>

<script type="module">
import * as THREE from 'three';
window.__gameStarted = true;

/* =====================================================================
   ZÁKLADY
   ===================================================================== */
const V3 = THREE.Vector3, Q = THREE.Quaternion;
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rnd = (a,b) => a+Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];
const dz = (v,d0,d1) => Math.sign(v)*clamp((Math.abs(v)-d0)/(d1-d0),0,1);
const angDiff = (a,b) => { let d=b-a; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return d; };
const TAU = Math.PI*2;
const SIM = new URLSearchParams(location.search).has('sim');
const XA = new V3(1,0,0), YA = new V3(0,1,0);

const Sfx = {
  ctx:null, out:null, nb:null, cg:null,
  init(){
    if (this.ctx) { if (this.ctx.state!=='running') this.ctx.resume().catch(()=>{}); return; }
    try {
      const C = window.AudioContext||window.webkitAudioContext; if (!C) return;
      const c = this.ctx = new C(); this.out = c.createGain(); this.out.gain.value = 0.75;
      const comp = c.createDynamicsCompressor(); this.out.connect(comp); comp.connect(c.destination);
      const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1; this.nb = b;
      const src = c.createBufferSource(); src.buffer=b; src.loop=true;
      const f = c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=650; f.Q.value=0.5;
      this.cg = c.createGain(); this.cg.gain.value = 0; src.connect(f); f.connect(this.cg); this.cg.connect(this.out); src.start();
    } catch(e){ this.ctx=null; }
  },
  ok(){ return this.ctx && S.sound; },
  tone(fq,dur,o={}){
    if (!this.ok()) return; const c=this.ctx, t=c.currentTime+(o.delay||0);
    const os=c.createOscillator(), g=c.createGain(); os.type=o.type||'sine'; os.frequency.setValueAtTime(fq,t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(Math.max(1,o.to), t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.vol??0.3, t+(o.a||0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    os.connect(g); g.connect(this.out); os.start(t); os.stop(t+dur+0.05);
  },
  noise(dur,o={}){
    if (!this.ok()) return; const c=this.ctx, t=c.currentTime+(o.delay||0);
    const s=c.createBufferSource(); s.buffer=this.nb; s.loop=true;
    const f=c.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.f||1000,t); if (o.to) f.frequency.exponentialRampToValueAtTime(o.to,t+dur); f.Q.value=o.q||1;
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.vol??0.3,t+(o.a||0.005)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t, Math.random()*0.5); s.stop(t+dur+0.05);
  },
  crowd(v){ if (this.cg && this.ctx) this.cg.gain.setTargetAtTime(S.sound?v:0, this.ctx.currentTime, 0.3); },
  cheer(){ if (!this.ok()||!this.cg) return; const t=this.ctx.currentTime; this.cg.gain.setTargetAtTime(0.32,t,0.05); this.cg.gain.setTargetAtTime(0.06,t+0.6,0.5); },
  hit(p=1){ this.tone(150,0.18,{to:42,vol:Math.min(1,0.75*p)}); this.noise(0.09,{type:'highpass',f:1500,vol:0.4}); this.tone(560+Math.random()*400,0.12,{type:'square',vol:0.06,to:250}); },
  block(){ this.tone(1300,0.15,{type:'triangle',vol:0.25,to:900}); this.tone(1950,0.1,{type:'square',vol:0.05}); this.noise(0.06,{type:'highpass',f:3500,vol:0.18}); },
  whoosh(){ this.noise(0.15,{f:700,to:2600,q:1.4,vol:0.2}); },
  boom(){ this.tone(90,0.7,{to:28,vol:1}); this.noise(0.6,{type:'lowpass',f:700,to:80,vol:0.7}); },
  zap(){ this.noise(0.4,{f:3200,q:5,vol:0.35}); this.tone(70,0.35,{type:'square',vol:0.12}); },
  laser(){ this.tone(1300,0.4,{type:'sawtooth',to:420,vol:0.12}); },
  power(){ this.tone(300,0.35,{type:'sawtooth',to:1200,vol:0.1}); this.tone(600,0.35,{to:2400,vol:0.07,delay:0.05}); },
  heal(){ this.tone(520,0.25,{to:880,vol:0.2}); this.tone(780,0.3,{to:1320,vol:0.12,delay:0.12}); },
  warn(){ this.tone(1500,0.08,{type:'square',vol:0.07}); },
  beep(hi){ this.tone(hi?1046:523,hi?0.5:0.18,{type:'square',vol:0.14}); },
  bell(){ for (const [f,v] of [[880,0.3],[1320,0.17],[1760,0.12],[2640,0.05]]) this.tone(f,1.5,{vol:v,a:0.002}); },
};

    g.fillStyle='#1b2546'; g.fillRect(0,0,1024,1024);
    g.strokeStyle='rgba(255,255,255,.06)'; g.lineWidth=3;
    for (let i=0;i<=1024;i+=64){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,1024); g.stroke(); g.beginPath(); g.moveTo(0,i); g.lineTo(1024,i); g.stroke(); }

    g.fillStyle='rgba(255,255,255,.85)'; g.fillText('ROBO',512,452); g.fillStyle='#ffd23f'; g.fillText('RING',512,578);
    g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=10; g.strokeRect(14,14,996,996);
  });
  floorTex.anisotropy = 4;
  const side = new THREE.MeshStandardMaterial({color:0x10204a, roughness:0.8});
  const top = new THREE.MeshStandardMaterial({map:floorTex, roughness:0.85});
  const plat = new THREE.Mesh(new THREE.BoxGeometry(RING+2.4,1.4,RING+2.4), [side,side,top,side,side,side]);
  plat.position.y = -0.7; scene.add(plat);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(220,220), new THREE.MeshStandardMaterial({color:0x0a0d18, roughness:1}));
  ground.rotation.x = -Math.PI/2; ground.position.y = -1.4; scene.add(ground);
  const P = RING/2 + 0.4, postH = 5.2;
  const postMat = [new THREE.MeshStandardMaterial({color:0xd8202a,metalness:.4,roughness:.4}), new THREE.MeshStandardMaterial({color:0x1d4fe0,metalness:.4,roughness:.4}), new THREE.MeshStandardMaterial({color:0xdddddd,metalness:.4,roughness:.4})];
  const corners = [[P,P,2],[-P,P,1],[-P,-P,2],[P,-P,0]];
  for (const [x,z,m] of corners){ const p=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.32,postH,12), postMat[m]); p.position.set(x,postH/2,z); scene.add(p); }
  const ropeCols = [0xff3040, 0xffffff, 0x3060ff];
  [1.6, 2.9, 4.2].forEach((y,k)=>{
    const mat = new THREE.MeshStandardMaterial({color:ropeCols[k], roughness:.5, emissive:ropeCols[k], emissiveIntensity:0.15});

      const r = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,2*P,8), mat);

      r.position.set(0,y,P); scene.add(g);
    }

  // diváci
  const N = 420, crowd = new THREE.InstancedMesh(new THREE.BoxGeometry(0.7,1.1,0.5), new THREE.MeshLambertMaterial({color:0xffffff}), N);

const FX = {
  N:700, p:[], cnt:0, col:new THREE.Color(), dm:new THREE.Object3D(),
  init(){
    this.mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshBasicMaterial({transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false}), this.N);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); this.mesh.frustumCulled=false;
    for (let i=0;i<this.N;i++) { this.p.push({x:0,y:0,z:0,vx:0,vy:0,vz:0,l:0,m:1,s:1,g:0,r:1,gg:1,b:1}); this.mesh.setColorAt(i,this.col.setRGB(1,1,1)); }
    this.mesh.count=0; scene.add(this.mesh);
    this.rings = []; for (let i=0;i<5;i++){ const m=new THREE.Mesh(new THREE.RingGeometry(0.85,1,48), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,toneMapped:false})); m.rotation.x=-Math.PI/2; m.visible=false; scene.add(m); this.rings.push({m,t:0,d:0.5,R:5}); }
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3*2*40),3));
    this.bolt = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({color:0x9fe8ff, transparent:true, blending:THREE.AdditiveBlending, toneMapped:false}));
    this.bolt.visible=false; this.bolt.frustumCulled=false; scene.add(this.bolt); this.boltT=0; this.boltA=new V3(); this.boltB=new V3();
  },
  emit(x,y,z,vx,vy,vz,life,size,hex,grav=0){
    let p; if (this.cnt<this.N) p=this.p[this.cnt++]; else p=this.p[(Math.random()*this.N)|0];
    p.x=x;p.y=y;p.z=z;p.vx=vx;p.vy=vy;p.vz=vz;p.l=p.m=life;p.s=size;p.g=grav;
    p.r=((hex>>16)&255)/255; p.gg=((hex>>8)&255)/255; p.b=(hex&255)/255;
  },
  burst(pos,n,hex,spd=6,size=0.18,life=0.5,grav=-9){
    for (let i=0;i<n;i++){ const a=rnd(0,TAU), b=rnd(-1,1), s=spd*rnd(0.4,1), c=Math.sqrt(1-b*b);
      this.emit(pos.x,pos.y,pos.z, Math.cos(a)*c*s, b*s+spd*0.3, Math.sin(a)*c*s, life*rnd(0.6,1.2), size*rnd(0.6,1.3), hex, grav); }
  },
  ring(pos,R,hex,d=0.5){ const r=this.rings.find(r=>!r.m.visible)||this.rings[0]; r.m.visible=true; r.t=0; r.d=d; r.R=R; r.m.position.set(pos.x,0.08,pos.z); r.m.material.color.setHex(hex); },
  lightning(a,b,t=0.3){ this.boltA.copy(a); this.boltB.copy(b); this.boltT=t; this.bolt.visible=true; },
  update(dt){
    let j=0; const P=this.p;
    for (let i=0;i<this.cnt;i++){
      const p=P[i]; p.l-=dt; if (p.l<=0) continue;
      p.vy+=p.g*dt; const dr=Math.exp(-2*dt); p.vx*=dr; p.vz*=dr;
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; if (p.y<0.03){ p.y=0.03; p.vy*=-0.3; }
      const k=p.l/p.m, s=p.s*(0.3+0.7*k);
      this.dm.position.set(p.x,p.y,p.z); this.dm.scale.set(s,s,s); this.dm.rotation.set(p.x*3,p.y*3,0); this.dm.updateMatrix();
      this.mesh.setMatrixAt(j,this.dm.matrix); this.mesh.setColorAt(j,this.col.setRGB(p.r*k,p.gg*k,p.b*k));
      if (j!==i){ P[i]=P[j]; P[j]=p; } j++;

class AI {
  constructor(r,foe){ this.r=r; this.foe=foe; this.reset(); }
  reset(){ this.atk=null; this.cd=rnd(1.2,2); this.blockT=0; this.circ=pick([-1,1]); this.circT=rnd(1,3); this.skT=rnd(...DIFF[S.diff].skill)*0.5; this.retreatT=0; this.chain=0; this.hy=0; this.hp=0; }
  onPlayerPunch(){ const D=DIFF[S.diff]; if (!this.atk&&this.r.stunT<=0&&!this.r.action&&Math.random()<D.block) this.blockT=Math.max(this.blockT,rnd(0.6,1.1)); }
  onHit(){ if (Math.random()<0.22) this.retreatT=rnd(0.5,1.1); if (this.atk&&this.atk.ph==='wind'&&Math.random()<0.4){ this.atk=null; this.cd=rnd(0.4,0.9); } }
  setPose(name){ const P=POSES[name]; for (let i=0;i<2;i++){ this.r.tArms[i].u.copy(P[i][0]); this.r.tArms[i].f.copy(P[i][1]); this.r.armK[i]=0; } }
  update(dt){
    const r=this.r, f=this.foe, D=DIFF[S.diff];
    r.blocking=false;
    if (r.ko){ this.setPose('down'); r.moveIn.set(0,0); return; }
    if (f.ko){ this.setPose('cheer'); r.moveIn.set(0,0); return; }
    const dist=Math.hypot(f.pos.x-r.pos.x,f.pos.z-r.pos.z);
    // hlava sleduje soupeře (u laseru pomaleji => dá se uhnout)
    _v1.copy(f.chestW).lerp(f.headW,0.5).sub(r.eyeW); const yawT=angDiff(r.face,Math.atan2(_v1.x,_v1.z)), pitT=-Math.atan2(_v1.y,Math.hypot(_v1.x,_v1.z));
    const aimSpd=(r.laserT>0||r.freezeT>0)?D.aim:8;
    this.hy+=clamp(yawT-this.hy,-aimSpd*dt,aimSpd*dt); this.hp+=clamp(pitT-this.hp,-aimSpd*dt,aimSpd*dt);
    _e1.set(clamp(this.hp,-0.6,0.6),clamp(this.hy,-1.1,1.1),0,'YXZ'); r.tHead.setFromEuler(_e1);
    const lean=this.atk&&this.atk.ph!=='wind'?0.18:0.05+0.03*Math.sin(G.t*2.3);
    _e1.set(lean,0.1*Math.sin(G.t*1.7),0,'YXZ'); r.tTorso.setFromEuler(_e1);
    if (r.stunT>0||r.pullT>0){ this.atk=null; r.moveIn.set(0,0); this.setPose('down'); return; }
    this.blockT-=dt; this.retreatT-=dt; this.circT-=dt; this.skT-=dt; this.cd-=dt*(r.slowT>0?0.5:1);
    // pohyb
    let want=r.reach*0.78+f.radius*0.3;
    if (this.retreatT>0) want=r.reach*1.8;
    if (this.range) want=this.range;
    let mz=clamp((dist-want)*0.9,-1,1);
    if (this.circT<0){ this.circ=pick([-1,0,1,1,-1]); this.circT=rnd(0.8,2.4); }
    let mx=this.circ*0.55;
    if (this.atk){ mz*=0.35; mx*=0.2; }
    if (r.action||r.laserT>0||r.flameT>0||r.freezeT>0){ mz*=0.25; mx*=0.4; }
    r.moveIn.set(mx,mz);
    // speciály
    if (this.skT<=0&&!this.atk&&!r.action){ this.skT=rnd(...D.skill); this.trySkill(dist); }
    if (this.range&&(this.rangeT-=dt)<0) this.range=0;
    // útok / blok
    if (this.atk) this.updAtk(dt,D);
    else if (this.blockT>0){ r.blocking=true; this.setPose('block'); }
    else if (r.spinT>0){ this.setPose('tpose'); }
    else if (r.action){ }
    else {
      this.setPose('guard');
      if (this.cd<=0&&dist<r.reach*1.05+f.radius*0.6) this.startAtk(D);
    }
  }
  trySkill(dist){
    const r=this.r;
    const opts=r.def.skills.filter(id=>{ const s=SK[id]; return r.energy>=s.cost&&r.cd[id]<=0; });
    if (!opts.length) return;
    const id=pick(opts), s=SK[id];
    if (id==='repair'&&r.hp>r.maxHp*0.7) return;
    if (dist>=s.r[0]&&dist<=s.r[1]) { useSkill(r,this.foe,id); }
    else if (s.r[0]>0&&dist<s.r[0]) { this.range=s.r[0]+1.5; this.rangeT=2.5; this.skT=1.2; }
    else this.skT=0.8;
  }
  startAtk(D){
    const r=this.r, side=Math.random()<0.5?0:1;
    const wind=(0.78-r.def.spd*0.035)*D.wind*(r.slowT>0?1.5:1)*(r.turboT>0?0.7:1);
    r.arms[side].sp.getWorldPosition(_v1); const canHead=reachD(_v1,this.foe.headW)<=r.reach+this.foe.headR*0.6;
    this.atk={ph:'wind',t:0,wind,lock:Math.max(0.1,wind-D.lead),side,zone:canHead&&Math.random()<0.68?'head':'body',aim:new V3(),locked:false,done:false};
  }
  updAtk(dt,D){
    const a=this.atk, r=this.r, f=this.foe; a.t+=dt;
    const zp=a.zone==='head'?f.headW:f.chestW;
    const P=POSES.guard, o=1-a.side;
    r.tArms[o].u.copy(P[o][0]); r.tArms[o].f.copy(P[o][1]);
    if (a.ph==='wind'){
      if (!a.locked){ a.aim.copy(zp); if (a.t>=a.lock){ a.locked=true; if (f===G.p) Sfx.warn(); } }
      const W_=POSES.wind[a.side]; r.tArms[a.side].u.copy(W_[0]); r.tArms[a.side].f.copy(W_[1]); r.armK[a.side]=12;
      r.glow[a.side]=Math.max(r.glow[a.side],clamp(a.t/a.wind,0,1)*(a.locked?1.6:0.6));
      if (a.t>=a.wind){ a.ph='strike'; a.t=0; Sfx.whoosh(); }
    } else if (a.ph==='strike'){
      r.dirTo(a.side,a.aim,r.tArms[a.side].u); r.tArms[a.side].f.copy(r.tArms[a.side].u); r.armK[a.side]=45; r.glow[a.side]=1.6;
      if (a.t>=0.1&&!a.done){ a.done=true; resolveAiHit(r,f,a); a.ph='rec'; a.t=0; }
    } else {
      const G_=POSES.guard[a.side]; r.tArms[a.side].u.copy(G_[0]); r.tArms[a.side].f.copy(G_[1]); r.armK[a.side]=10;
      if (a.t>=0.32){ this.atk=null; this.chain++; if (this.chain<3&&Math.random()<D.chain) this.cd=0.08; else { this.cd=rnd(...D.cd); this.chain=0; } }
    }
  }
}

/* ----- údery hráče ----- */
function startPlayerPunch(ev){
  const p=G.p, arm=p.arms[ev.side];
  if (p.stunT>0||p.ko||p.action||p.spinT>0||arm.punch) return;
  arm.punch={t:0,dur:0.3*(p.mod.pcd||1)*(p.turboT>0?0.7:1),zone:ev.high?'head':'body',power:ev.power,done:false};
  G.stats.punches++; Sfx.whoosh(); G.ai.onPlayerPunch();
}
const _tp=new V3();
function updPlayerPunches(dt){
  const p=G.p, e=G.e;
  for (let i=0;i<2;i++){
    const arm=p.arms[i], pu=arm.punch; if (!pu) continue;
    pu.t+=dt;
    const T=pu.zone==='head'?e.headW:e.chestW;
    const w=pu.t<0.06?pu.t/0.06:pu.t<0.15?1:Math.max(0,1-(pu.t-0.15)/Math.max(0.05,pu.dur-0.15));
    p.dirTo(i,T,_tp);
    p.tArms[i].u.lerp(_tp,w).normalize(); p.tArms[i].f.lerp(_tp,w).normalize(); p.armK[i]=w>0.05?55:0;
    if (!pu.done&&pu.t>=0.06){ pu.done=true; resolvePlayerHit(i,pu); }
    if (pu.t>=pu.dur){ arm.punch=null; p.armK[i]=0; }
  }
}
function resolvePlayerHit(i,pu){
  const p=G.p, e=G.e;
  const S_=p.arms[i].sp.getWorldPosition(_v1);
  const okH=reachD(S_,e.headW)<=p.reach+e.headR*0.9, okB=reachD(S_,e.chestW)<=p.reach+e.chestR*0.9;
  if (pu.zone==='head'&&!okH&&okB) pu.zone='body'; else if (pu.zone==='body'&&!okB&&okH) pu.zone='head';
  if (!okH&&!okB){ floatAt(p.arms[i].fist.getWorldPosition(_v2),'VEDLE','#aaa'); return; }
  const T=pu.zone==='head'?e.headW:e.chestW;
  const at=_v3.copy(T).lerp(S_,0.15);
  if (e.shieldT>0){ dealDamage(p,e,1,{at}); return; }
  let dmg=5*(0.7+0.05*p.def.str)*(0.85+0.3*pu.power)*(1+Math.min(G.combo,6)*0.05)*(p.mod.pow||1);
  if (p.turboT>0) dmg*=1.3; if (p.dashT>0) dmg*=2;
  if (pu.zone==='head') dmg*=1.15*(p.mod.head||1);
  const blocked=e.blocking;
  if (blocked){ dmg*=0.2*(e.mod.block?e.mod.block*2:1); G.stats.blocks; }
  dealDamage(p,e,dmg,{punch:true,blocked,zone:pu.zone,kb:blocked?0.5:1.4*pu.power,at,en:blocked?2:7});
  if (!blocked&&p.mod.burn&&Math.random()<p.mod.burn){ e.burnT=2.5; floatAt(e.headW,'🔥 HOŘÍ','#ffa040'); }
}
function resolveAiHit(r,f,a){
  const zp=a.zone==='head'?f.headW:f.chestW, zr=a.zone==='head'?f.headR:f.chestR;
  const S_=r.arms[a.side].sp.getWorldPosition(_v1);
  const inReach=reachD(S_,a.aim)<=r.reach+zr*0.8;
  const near=zp.distanceTo(a.aim)<=zr+r.fistR+0.05;
  if (!inReach||!near){
    if (f===G.p){ floatAt(f.headW,'UHNUL!','#7dffb0',true); G.stats.dodges++; f.energy=Math.min(100,f.energy+10*(f.mod.dodge||1)); Sfx.whoosh(); }
    return;
  }
  let dmg=6*(0.7+0.05*r.def.str)*(r.turboT>0?1.3:1)*(r.dashT>0?2:1)*(a.zone==='head'?1.2:1)*(r.mod.pow||1);
  let blocked=false;
  if (f.guardL&&f.guardR){ blocked=true; dmg*=(a.zone==='head'?0.15:0.35)*(f.mod.block?f.mod.block*2:1); }
  else if (a.zone==='head'&&(f.guardL||f.guardR)){ blocked=true; dmg*=0.55; }
  if (blocked&&f===G.p) G.stats.blocks++;
  dealDamage(r,f,dmg,{punch:true,blocked,zone:a.zone,kb:blocked?0.5:1.5,at:_v2.copy(zp).lerp(S_,0.2),en:blocked?2:7});
}
function dealDamage(a,v,dmg,o={}){

    const low=r.hp/r.maxHp<0.3; if (hudC['low'+n]!==low){ hudC['low'+n]=low; $(`p${n}bar`).classList.toggle('low',low); } }
  setTxt($('timer'),String(Math.max(0,Math.ceil(G.time))),'tm'); setTxt($('rnd'),'KOLO '+G.round,'rd');
  setTxt($('p1w'),'★'.repeat(G.wins[0])+'☆'.repeat(Math.max(0,2-G.wins[0])),'w1'); setTxt($('p2w'),'☆'.repeat(Math.max(0,2-G.wins[1]))+'★'.repeat(G.wins[1]),'w2');
  p.def.skills.forEach((id,i)=>{ const sk=SK[id], cd=p.cd[id], ready=cd<=0&&p.energy>=sk.cost, el=$('sk'+i);
    if (hudC['skr'+i]!==ready){ hudC['skr'+i]=ready; el.classList.toggle('ready',ready); }
    const t=cd>0?Math.ceil(cd)+' s':p.energy<sk.cost?Math.round(p.energy)+'/'+sk.cost:''; setTxt(el.lastChild,t,'skt'+i); el.lastChild.style.display=t?'flex':'none'; });
  const g=p.blocking&&G.state==='fight'; if (hudC.g!==g){ hudC.g=g; $('guardInd').classList.toggle('on',g); }
  const cmb=G.combo>=2&&G.comboT>0; setTxt($('combo'),cmb?G.combo+'× COMBO':'','cb'); if (hudC.cbo!==cmb){ hudC.cbo=cmb; $('combo').classList.toggle('on',cmb); }
  if (G.mode==='cam') setTxt($('pipInfo'),SIM?'SIMULACE':`detekce ${Math.round(Tracker.detFps)}/s · ${Math.round(Tracker.detMs)} ms · ${Tracker.delegate}`,'pi');
}
function updWarn(){
  const need=G.mode==='cam'&&G.p&&['vs','intro','fight'].includes(G.state)&&!G.paused&&!Tracker.valid;
  if (need){ show('warn'); setTxt($('warnText'),Tracker.reason||'Postav se před kameru','wt'); setTxt($('warnTitle'),Tracker.checks.hip||!Tracker.checks.sh?'NEJSI VIDĚT CELÝ':'NEJSI VIDĚT DO PASU','wti'); }
  else if (!$('warn').classList.contains('hidden')){ show('warn',false); if (G.state==='fight') announce('POKRAČUJ!'); }
}
function updMatch(dt){
  const p=G.p, e=G.e;
  const camOk=G.mode!=='cam'||Tracker.valid;
  const frozen=G.paused||(!camOk&&['vs','intro','fight'].includes(G.state));
  let ldt=frozen?0:dt;
  if (G.hitstop>0){ G.hitstop-=dt; ldt*=0.1; }
  if (G.slow>0){ G.slow-=dt; ldt*=0.35; }
  if (!frozen) applyPlayer(ldt,G.state==='fight'); else INP.ev.length=0;
  if (!frozen){
    G.stT+=dt;
    if (G.state==='vs'){ if (G.stT>2.3){ G.state='intro'; G.stT=0; } }
    else if (G.state==='intro'){
      if (G.introStep===0){ G.introStep=1; announce(`KOLO ${G.round}`); say(`Kolo ${['jedna','dva','tři','čtyři','pět'][G.round-1]}`); }
      if (G.stT>1.5){ G.state='fight'; G.stT=0; announce('BOJ!'); Sfx.bell(); Sfx.cheer(); say('Boj!'); }
    }
    else if (G.state==='fight'){
      G.time-=ldt; if (G.time<=0){ G.time=0; timeUp(); }
      G.comboT-=ldt; if (G.comboT<=0) G.combo=0;
      G.ai.update(ldt);
      updPlayerPunches(ldt);
      moveRobot(p,e,ldt); moveRobot(e,p,ldt); separate(p,e);
      updEffects(p,e,ldt); updEffects(e,p,ldt); updProjectiles(ldt);
    }
    else if (G.state==='ko'){ G.ai.update(ldt); if (G.stT>3.4) afterRound(); }
    else if (G.state==='result'){ G.ai.update(ldt); }
    if (G.state!=='fight'){ p.curSpeed=e.curSpeed=0; p.face+=angDiff(p.face,Math.atan2(e.pos.x-p.pos.x,e.pos.z-p.pos.z))*0.1; if (!e.ko) e.face+=angDiff(e.face,Math.atan2(p.pos.x-e.pos.x,p.pos.z-e.pos.z))*0.1; if (G.state!=='ko'&&G.state!=='result') G.ai.setPose('guard'); }
  }
  p.animate(ldt,G.t); e.animate(ldt,G.t);
  updWarn();
}
function updSelectScene(dt){
  const r=G.preview[S.bot]; if (r){ r.face+=dt*0.5; for (let i=0;i<2;i++){ r.tArms[i].u.copy(POSES.guard[i][0]); r.tArms[i].f.copy(POSES.guard[i][1]); } r.animate(dt,G.t); }
}
function updCamera(dt){
  const portrait=innerHeight>innerWidth;
  if (G.state==='select'){
    camera.fov=portrait?55:45; camera.updateProjectionMatrix();
    const a=0.25+Math.sin(G.t*0.15)*0.25, R=portrait?16:13.5; _cp.set(Math.sin(a)*R,3.2,Math.cos(a)*R); _cl.set(0,2.4,0);
    camPos.lerp(_cp,1-Math.exp(-3*dt)); camLook.lerp(_cl,1-Math.exp(-3*dt));
    camera.position.copy(camPos); camera.lookAt(camLook);
    const W=innerWidth, H=innerHeight; if (portrait) camera.setViewOffset(W,H,0,H*0.3,W,H); else camera.setViewOffset(W,H,Math.min(470,W*0.48)*0.5,0,W,H);
    return;
  }
  camera.clearViewOffset();
  if (G.state==='setup'&&!G.p){ return; }
  const p=G.p, e=G.e; if (!p) return;
  camera.fov=portrait?70:55; camera.updateProjectionMatrix();
  _v1.subVectors(e.pos,p.pos).setY(0); const dist=_v1.length(); _v1.normalize();
  const rx=-_v1.z, rz=_v1.x, Hm=Math.max(p.def.h,e.def.h*0.85);
  if (G.state==='vs'){
    const a=G.stT*0.5; const mid=_v2.addVectors(p.pos,e.pos).multiplyScalar(0.5);
    _cp.set(mid.x+Math.sin(a+1)*11,3.5+G.stT,mid.z+Math.cos(a+1)*11); _cl.copy(mid).setY(Hm*0.55);
  } else {
    const hp=p.def.h;
    const back=portrait?0.62*hp+2.2:0.62*hp+2.0, up=portrait?1.15*hp+1.2:0.95*hp+1.0, side=portrait?0.25*hp:0.45*hp;
    _cp.set(p.pos.x-_v1.x*back+rx*side, up, p.pos.z-_v1.z*back+rz*side);
    _cl.lerpVectors(p.pos,e.pos,0.6).setY(Math.max(e.def.h*0.45,p.def.h*0.35));
    if (G.state==='result'||G.state==='ko'){ const w=G.wins[0]>=G.wins[1]?p:e; _cl.lerp(_v3.copy(w.pos).setY(w.def.h*0.6),0.4); }
  }
  camPos.lerp(_cp,1-Math.exp(-(G.state==='vs'?2:5)*dt)); camLook.lerp(_cl,1-Math.exp(-7*dt));
  camera.position.copy(camPos);
  if (G.shake>0){ G.shake=Math.max(0,G.shake-dt*2.2); const s=G.shake*G.shake*0.5; camera.position.x+=rnd(-s,s); camera.position.y+=rnd(-s,s); camera.position.z+=rnd(-s,s); }
  camera.lookAt(camLook);
  // vlastní robot zprůhlední, když zakrývá soupeře
  const cp=camera.position, occ=G.state!=='vs'&&(segHit(cp,e.chestW,p.chestW,p.chestR*1.25)||segHit(cp,e.headW,p.headW,p.headR*1.7)||segHit(cp,e.headW,p.chestW,p.chestR*1.25)||segHit(cp,e.chestW,p.headW,p.headR*1.7));
  p.xr=lerp(p.xr??1,occ?0.38:1,1-Math.exp(-8*dt)); p.setOpacity(p.xr);
}
const _sd=new V3();
function segHit(a,b,c,r){ _sd.subVectors(b,a); const L=_sd.length(); _sd.divideScalar(L); const t=raySphere(a,_sd,c,r); return t>=0&&t<L; }
// klávesnice + dotyk (režim bez kamery)
const KMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',KeyL:'guard',Space:'guard'};
addEventListener('keydown',e=>{ if (G.mode!=='touch') return; if (KMAP[e.code]) KEYS[KMAP[e.code]]=true;
  if (!e.repeat){ if (e.code==='KeyJ') INP.ev.push({t:'punch',side:0,power:1,high:true}); if (e.code==='KeyK') INP.ev.push({t:'punch',side:1,power:1,high:Math.random()<0.6}); if (e.code==='Digit1'||e.code==='KeyQ') INP.ev.push({t:'skill',i:0}); if (e.code==='Digit2'||e.code==='KeyE') INP.ev.push({t:'skill',i:1}); if (e.code==='Escape') pauseGame(); } });
addEventListener('keyup',e=>{ if (KMAP[e.code]) KEYS[KMAP[e.code]]=false; });
$('touchPad').querySelectorAll('button').forEach(b=>{ const k=b.dataset.k;
  const dn=e=>{ e.preventDefault(); b.classList.add('dn'); Sfx.init();
    if (k==='pl') INP.ev.push({t:'punch',side:0,power:1,high:true}); else if (k==='pr') INP.ev.push({t:'punch',side:1,power:1,high:Math.random()<0.6});
    else if (k==='s0'||k==='s1') INP.ev.push({t:'skill',i:+k[1]}); else KEYS[k]=true; };
  const up=e=>{ b.classList.remove('dn'); if (!['pl','pr','s0','s1'].includes(k)) KEYS[k]=false; };
  b.addEventListener('pointerdown',dn); b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up); });

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

let last=performance.now(), ftAvg=16, ftT=0;
function frame(now){
  requestAnimationFrame(frame);
  const rawDt=(now-last)/1000; last=now; const dt=Math.min(0.05,Math.max(0,rawDt));
  G.t+=dt;
  Tracker.tick(now);
  if (G.state==='select') updSelectScene(dt);
  else if (G.state==='setup'){ updSetup(dt); if (G.p){ G.p.animate(0,G.t); G.e.animate(0,G.t); } }
  else if (G.p) updMatch(dt);
  FX.update(dt*(G.paused?0:1));
  updCamera(dt);
  updHud(dt);
  renderer.render(scene,camera);
  // automatické snížení rozlišení, když telefon nestíhá
  ftAvg=ftAvg*0.95+rawDt*1000*0.05; ftT+=dt;
  if (ftT>3&&ftAvg>24&&PR>1){ PR=Math.max(1,PR-0.25); renderer.setPixelRatio(PR); resize(); ftT=0; }
  if (ftT>3) ftT=0;
}

// start
show('loading',false); goSelect();
if (!SIM) Tracker.load(S.model).catch(()=>{}); else { Tracker.st='ready'; Tracker.msg='SIMULACE'; aiPill(); }
requestAnimationFrame(frame);
if (SIM) window.__G={G,Tracker,INP};
</script>
